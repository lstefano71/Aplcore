name: PR Validation

on:
  pull_request:
    branches: ['*']

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for NBGV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/AplcoreHandler/AplcoreHandler.csproj

      - name: Build
        run: dotnet build src/AplcoreHandler/AplcoreHandler.csproj -c Release --no-restore

      - name: Publish AOT (verify)
        run: dotnet publish src/AplcoreHandler/AplcoreHandler.csproj -c Release -o publish
