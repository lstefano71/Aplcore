name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish AOT
        run: dotnet publish src/AplcoreHandler/AplcoreHandler.csproj -c Release -o publish

      - name: Package release artifact
        id: package
        shell: pwsh
        run: |
          $zipName = "AplcoreHandler-${{ github.ref_name }}.zip"
          Compress-Archive -Path publish/AplcoreHandler.exe -DestinationPath "publish/$zipName" -Force
          echo "zip_path=publish/$zipName" >> $env:GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ steps.package.outputs.zip_path }}" --generate-notes
