name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish AOT
        run: dotnet publish src/AplcoreHandler/AplcoreHandler.csproj -c Release -o publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AplcoreHandler.exe
          generate_release_notes: true
