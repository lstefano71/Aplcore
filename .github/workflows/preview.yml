name: Preview Release

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          dotnet tool install --global nbgv 2>$null
          $ver = nbgv get-version -v NuGetPackageVersion
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          $branch = "${{ github.ref_name }}" -replace '[^a-zA-Z0-9_.-]', '-'
          echo "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Publish AOT
        run: dotnet publish src/AplcoreHandler/AplcoreHandler.csproj -c Release -o publish

      - name: Package preview artifact
        id: package
        shell: pwsh
        run: |
          $zipName = "AplcoreHandler-${{ steps.version.outputs.version }}-${{ steps.version.outputs.branch }}.zip"
          Compress-Archive -Path publish/AplcoreHandler.exe -DestinationPath "publish/$zipName" -Force
          echo "zip_path=publish/$zipName" >> $env:GITHUB_OUTPUT

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: preview-${{ steps.version.outputs.branch }}
          NAME: "Preview: ${{ steps.version.outputs.branch }} (${{ steps.version.outputs.version }})"
          NOTES: "Preview build from branch `${{ github.ref_name }}` at commit ${{ github.sha }}.\nVersion: `${{ steps.version.outputs.version }}`"
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:TAG --title "$env:NAME" --notes "$env:NOTES" --draft --prerelease
            gh release upload $env:TAG "${{ steps.package.outputs.zip_path }}" --clobber
          }
          else {
            gh release create $env:TAG "${{ steps.package.outputs.zip_path }}" --title "$env:NAME" --notes "$env:NOTES" --draft --prerelease --target "${{ github.sha }}"
          }
